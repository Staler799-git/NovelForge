# =============================================================================
# NovelForge – Codemagic CI/CD konfigurace
# =============================================================================
#
# Workflow: ios-device-unsigned
#   Název v Codemagic UI: "NovelForge – iOS IPA for Signulous"
#
# Sestaví skutečnou iOS aplikaci pro fyzický iPhone (generic/platform=iOS,
# iPhoneOS SDK, arm64), ZCELA BEZ PODPISU, zabalí ji do NovelForge.ipa a tu do
# NovelForge-Signulous.zip. Podpis provádí až Signulous – tento workflow
# NEPOUŽÍVÁ Apple Developer účet, App Store Connect, TestFlight, certifikáty
# ani provisioning profiles, a neposílá e-mailové notifikace.
#
# Artefakty (Codemagic → Artifacts):
#   artifacts/NovelForge-Signulous.zip   ← hlavní soubor ke stažení (obsahuje IPA)
#   artifacts/NovelForge.ipa             ← samostatná IPA jako záloha
#   artifacts/build-info.txt             ← Bundle ID, verze, architektury
#   build/xcodebuild.log                 ← log pro diagnostiku
#
# Workflow: novelforge-web-tests (volitelný)
#   Rychlá kontrola webové části (npm ci / tsc / vite build / vitest) na Linuxu.
#
# Manuální spuštění: Codemagic → Start new build → branch main → vybrat workflow.
# Automatický build: triggering.events: push, branch_patterns: main.
#
# POZNÁMKA: Hodnoty jsou záměrně vypsané přímo (bez YAML merge keys `<<`),
# aby konfigurace nezávisela na tom, jaký YAML parser Codemagic používá.
# =============================================================================

workflows:
  # ===========================================================================
  # HLAVNÍ WORKFLOW – unsigned IPA pro Signulous
  # ===========================================================================
  ios-device-unsigned:
    name: NovelForge – iOS IPA for Signulous
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      node: 22.22.1 # @capacitor/cli 8 vyžaduje Node >= 22
      xcode: latest # aktuální oficiální Xcode na macOS stroji (Xcode 26.x)
      cocoapods: default # CocoaPods předinstalovaný v imagi (1.16.x)
      ruby: default
      vars:
        BUNDLE_ID: com.novelforge.app
        XCODE_SCHEME: App
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_PROJECT: ios/App/App.xcodeproj
        # 1.2.0 = logické kapitoly (alternativní verze), čištění reklam, WTR-LAB, oprava projektů.
        # Číslo buildu (CFBundleVersion) = Codemagic BUILD_NUMBER, roste s každým během.
        APP_VERSION: 1.2.0

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.npm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Ověřit prostředí (Xcode, Node, CocoaPods)
        script: |
          set -e
          echo "Xcode:"; xcodebuild -version
          echo "Node: $(node -v)"; echo "npm: $(npm -v)"
          echo "CocoaPods: $(pod --version)"
          echo "Ruby: $(ruby -v)"
          echo "Selected Xcode: $(xcode-select -p)"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Nainstalovat npm závislosti (npm ci)
        script: |
          set -e
          node -e "const v=process.versions.node.split('.').map(Number); if (v[0] < 22) { console.error('Node >= 22 is required, found '+process.version); process.exit(1); }"
          npm ci --no-audit --no-fund
          echo "--- Capacitor packages ---"
          npm ls @capacitor/core @capacitor/cli @capacitor/ios --depth=0

      - name: Validovat codemagic.yaml proti schématu
        script: |
          set -e
          npm run validate:codemagic

      - name: Statická kontrola TypeScriptu
        script: |
          set -e
          npx tsc --noEmit

      - name: Unit testy (vitest)
        script: |
          set -e
          npm test

      - name: Sestavit webovou část (Vite → dist/)
        script: |
          set -e
          # `npm run build` sám volá scripts/check-css.mjs, takže když Tailwind
          # nevygeneruje CSS (chybějící postcss.config.js) nebo zůstanou surové
          # @tailwind direktivy, build tady SELŽE – ne až na iPhonu bílou obrazovkou.
          npm run build
          test -f dist/index.html || { echo "dist/index.html chybí"; exit 1; }
          echo "Web build OK: $(du -sh dist | cut -f1)"

      - name: Ověřit produkční CSS (Tailwind se skutečně vygeneroval)
        script: |
          set -e
          # Samostatný krok pro rychlou diagnostiku: kdyby kontrola spadla ve
          # "Sestavit webovou část", tady je vidět přesně které pravidlo chybí.
          node scripts/check-css.mjs
          echo
          echo "--- velikost CSS ---"
          ls -la dist/assets/*.css
          echo
          echo "--- ověření klíčových pravidel ---"
          grep -q "background-color:rgb(10 10 11" dist/assets/*.css \
            || { echo "CHYBA: chybí tmavé pozadí #0a0a0b"; exit 1; }
          grep -q -- "-apple-system" dist/assets/*.css \
            || { echo "CHYBA: chybí systémové písmo"; exit 1; }
          grep -q "\.tabbar{" dist/assets/*.css \
            || { echo "CHYBA: chybí spodní navigace (.tabbar)"; exit 1; }
          grep -q "safe-area-inset-bottom" dist/assets/*.css \
            || { echo "CHYBA: chybí iOS safe-area"; exit 1; }
          if grep -qE "@tailwind (base|components|utilities)" dist/assets/*.css; then
            echo "CHYBA: v CSS zůstaly surové @tailwind direktivy – Tailwind neproběhl"
            echo "       (chybí postcss.config.js?)"
            exit 1
          fi
          echo "Produkční CSS obsahuje Tailwind utility, tmavé pozadí, tabbar i safe-area."

      - name: Synchronizovat Capacitor iOS projekt
        script: |
          set -e
          # POZOR: bez --deployment. Capacitor CLI předává --deployment do
          # `pod install --deployment`, a ten vyžaduje commitnutý Podfile.lock.
          # Ten v repu není (je v .gitignore), takže build padá na:
          #   [!] There were changes to the podfile in deployment mode
          npx cap sync ios
          # Capacitor auto-registruje jen pluginy z node_modules. WebRenderer.swift
          # je lokální plugin v tomto repu, doplníme ho do packageClassList.
          node scripts/patch-ios-plugins.mjs
          test -f ios/App/App/public/index.html || { echo "Web assets nebyly zkopírovány"; exit 1; }
          grep -q '"WebRenderer"' ios/App/App/capacitor.config.json \
            || { echo "WebRenderer plugin není zaregistrován v capacitor.config.json"; exit 1; }
          # CSS musí být zkopírováno do nativní aplikace – jinak WKWebView
          # načte index.html bez stylů (bílá obrazovka i s dobrým dist).
          test -f ios/App/App/public/index.html || { echo "Web assets nejsou v iOS projektu"; exit 1; }
          IOS_CSS_COUNT="$(find ios/App/App/public/assets -maxdepth 1 -name '*.css' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${IOS_CSS_COUNT:-0}" -eq 0 ]; then
            echo "CHYBA: v ios/App/App/public/assets není žádné CSS – WKWebView by neměl styly"
            exit 1
          fi
          IOS_CSS_SIZE="$(find ios/App/App/public/assets -maxdepth 1 -name '*.css' -exec cat {} + | wc -c | tr -d ' ')"
          echo "CSS zkopírováno do iOS: ${IOS_CSS_COUNT} soubor(ů), ${IOS_CSS_SIZE} B"
          if [ "${IOS_CSS_SIZE:-0}" -lt 5000 ]; then
            echo "CHYBA: CSS v iOS je příliš malé (${IOS_CSS_SIZE} B) – Tailwind neproběhl"
            exit 1
          fi
          grep -q "background-color:rgb(10 10 11" ios/App/App/public/assets/*.css \
            || { echo "CHYBA: CSS v iOS neobsahuje tmavé pozadí"; exit 1; }

          echo "--- ios/App/App/capacitor.config.json ---"
          cat ios/App/App/capacitor.config.json

      - name: Ověřit CocoaPods závislosti
        script: |
          set -e
          cd ios/App
          pod --version
          # `npx cap sync ios` už `pod install` spustil (Capacitor CLI to dělá sám).
          # Tady jen ověříme výsledek; --repo-update je záložní větev pro případ,
          # že lockfile chybí (první běh, změna Podfile).
          if [ ! -f Podfile.lock ] || [ ! -f Pods/Manifest.lock ]; then
            echo "Podfile.lock/Manifest.lock chybí – spouštím pod install --repo-update"
            pod install --repo-update
          else
            echo "CocoaPods závislosti už jsou nainstalované (z cap sync)."
          fi
          test -f Pods/Manifest.lock || { echo "pod install neproběhl"; exit 1; }
          test -f App.xcworkspace/contents.xcworkspacedata || { echo "xcworkspace je neplatný"; exit 1; }
          echo "--- Nainstalované pod závislosti ---"
          ls Pods | head -40
          cd ../..

      - name: Sestavit unsigned aplikaci pro fyzický iPhone
        script: |
          set -e
          # generic/platform=iOS + -sdk iphoneos => fyzické zařízení, nikoli simulátor.
          xcodebuild \
            -workspace "${XCODE_WORKSPACE:-ios/App/App.xcworkspace}" \
            -scheme "${XCODE_SCHEME:-App}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derived \
            -allowProvisioningUpdates=NO \
            MARKETING_VERSION="${APP_VERSION:-1.2.0}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER:-5}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build
          test -d build/derived/Build/Products/Release-iphoneos/App.app \
            || { echo "App.app nebyl vytvořen"; exit 1; }

      - name: Vytvořit IPA, ZIP a ověřit integritu
        script: |
          set -e
          # Skript ověří IPA i ZIP; při jakékoli chybě skončí exit 1 => build FAILED.
          bash scripts/build-ios-unsigned.sh

      - name: Souhrn artefaktů
        script: |
          set -e
          echo "=== ARTEFAKTY ==="
          ls -la artifacts/
          echo
          echo "=== OBSAH ZIPu ==="
          unzip -l artifacts/NovelForge-Signulous.zip
          echo
          echo "=== OBSAH IPA (prvních 40 záznamů) ==="
          unzip -l artifacts/NovelForge.ipa | head -40
          echo
          echo "=== ARCHITEKTURY BINÁRKY ==="
          lipo -archs build/derived/Build/Products/Release-iphoneos/App.app/App
          echo
          echo "=== INFO ==="
          cat artifacts/build-info.txt
          echo
          echo "=== SHA256 ==="
          shasum -a 256 artifacts/NovelForge.ipa artifacts/NovelForge-Signulous.zip

    artifacts:
      - artifacts/NovelForge-Signulous.zip
      - artifacts/NovelForge.ipa
      - artifacts/build-info.txt
      - build/xcodebuild.log
      - build/derived/Build/Products/Release-iphoneos/App.app.dSYM

  # ===========================================================================
  # VOLITELNÝ WORKFLOW – rychlé testy webové části (bez macOS minut)
  # ===========================================================================
  novelforge-web-tests:
    name: NovelForge – Web tests (no iOS build)
    instance_type: linux_x2
    max_build_duration: 30

    environment:
      node: 22.22.1

    triggering:
      events:
        - pull_request
      branch_patterns:
        # `source: true` = pattern se vztahuje na zdrojovou (head) větev PR.
        # Pro cílovou větev se používá samostatný záznam se source: false
        # (schéma Codemagic nezná klíč `target`).
        - pattern: "*"
          include: true
          source: true
        - pattern: main
          include: true
          source: false

    scripts:
      - name: Instalace závislostí
        script: |
          set -e
          npm ci --no-audit --no-fund

      - name: Validovat codemagic.yaml proti schématu
        script: |
          set -e
          npm run validate:codemagic

      - name: TypeScript kontrola
        script: |
          set -e
          npx tsc --noEmit

      - name: Unit testy
        script: |
          set -e
          npm test

      - name: Produkční build
        script: |
          set -e
          npm run build
          test -f dist/index.html

    artifacts:
      - dist/**/*
